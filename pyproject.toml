[project]
name = "math-edu"
version = "0.1.0"
description = "大班数学配套网站 —— 本地离线互动数学教育站点，uv 管理的单 FastAPI 应用"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    "dashscope",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "alibabacloud-dypnsapi20170525>=2.0.0",
    "alibabacloud-tea-openapi>=0.4.5",
    "alibabacloud-tea-util>=0.3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_edu"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
